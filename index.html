<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koul - Éditeur de Luxe</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #181818;
            --panel-color: #222222;
            --accent-gold: #d4af37;
            --inner-shadow: inset 6px 6px 12px #121212, inset -2px -2px 8px #323232;
            --outer-shadow: 10px 10px 20px #0d0d0d, -5px -5px 15px #2d2d2d;
        }

        body { 
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-color);
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .app-shell {
            width: 100%;
            max-width: 400px;
            background: var(--panel-color);
            padding: 30px 20px;
            border-radius: 40px;
            box-shadow: var(--outer-shadow);
            border: 1px solid #2a2a2a;
            text-align: center;
        }

        h1 { 
            font-family: 'Montserrat', sans-serif;
            font-size: 1.2rem;
            color: var(--accent-gold);
            margin-bottom: 30px;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        /* Style skeuomorphique pour l'input file */
        input[type="file"] {
            background: #1a1a1a;
            padding: 10px;
            border-radius: 12px;
            border: none;
            box-shadow: var(--inner-shadow);
            color: #777;
            font-size: 0.8rem;
            width: 100%;
            box-sizing: border-box;
        }

        .actions {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        button {
            padding: 18px;
            border-radius: 20px;
            border: none;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 1px;
        }

        .btn-main {
            background: linear-gradient(145deg, #d4af37, #b8962e);
            color: #000;
            box-shadow: 5px 5px 10px #0f0f0f, -2px -2px 5px #3a3a3a;
        }

        .btn-main:active {
            box-shadow: inset 3px 3px 6px #8a6d1d;
            transform: translateY(2px);
        }

        .btn-dl {
            background: #f0f0f0;
            color: #000;
            box-shadow: 5px 5px 10px #0f0f0f;
        }

        #resultCanvas {
            width: 100%;
            margin-top: 30px;
            border-radius: 15px;
            border: 6px solid #1a1a1a;
            box-shadow: var(--inner-shadow);
            display: none;
        }

    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

    <div class="app-shell">
        <h1>RestoKoul Pro</h1>
        
        <div class="input-group">
            <input type="file" id="img1" accept="image/*">
            <input type="file" id="img2" accept="image/*">
            <input type="file" id="img3" accept="image/*">
        </div>

        <div class="actions">
            <button class="btn-main" onclick="processBanner()">🚀 Compiler la photo</button>
            <button id="dlBtn" class="btn-dl" style="display:none;" onclick="download()">⬇️ Télécharger PNG</button>
        </div>

        <canvas id="resultCanvas" width="1200" height="360"></canvas>
    </div>

    <script>
        async function processBanner() {
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            const files = [
                document.getElementById('img1').files[0],
                document.getElementById('img2').files[0],
                document.getElementById('img3').files[0]
            ];

            if (files.some(f => !f)) return alert("Sélectionnez les 3 photos !");

            const imgs = await Promise.all(files.map(file => {
                return new Promise(resolve => {
                    const img = new Image();
                    img.onload = () => resolve(img);
                    img.src = URL.createObjectURL(file);
                });
            }));

            render(ctx, canvas, imgs);
            canvas.style.display = 'block';
            document.getElementById('dlBtn').style.display = 'block';
        }

        function render(ctx, canvas, imgs) {
            const { width: w, height: h } = canvas;
            const skew = 90; 
            const p1 = w / 3;
            const p2 = (w * 2) / 3;

            ctx.clearRect(0, 0, w, h);

            const zones = [
                () => {
                    ctx.moveTo(0, 0);
                    ctx.lineTo(p1 + skew + 2, 0); // +2 pour éviter les fissures
                    ctx.lineTo(p1 - skew + 2, h);
                    ctx.lineTo(0, h);
                },
                () => {
                    ctx.moveTo(p1 + skew, 0);
                    ctx.lineTo(p2 + skew + 2, 0);
                    ctx.lineTo(p2 - skew + 2, h);
                    ctx.lineTo(p1 - skew, h);
                },
                () => {
                    ctx.moveTo(p2 + skew, 0);
                    ctx.lineTo(w, 0);
                    ctx.lineTo(w, h);
                    ctx.lineTo(p2 - skew, h);
                }
            ];

            zones.forEach((drawPath, i) => {
                ctx.save();
                ctx.beginPath();
                drawPath();
                ctx.closePath();
                ctx.clip();
                
                // Calcul de la zone de dessin
                const xStart = (i === 0) ? 0 : (i === 1 ? p1 - skew : p2 - skew);
                const xEnd = (i === 0) ? p1 + skew : (i === 1 ? p2 + skew : w);
                
                drawCover(ctx, imgs[i], xStart, 0, xEnd - xStart, h);
                
                // Ombre interne pour relief
                ctx.shadowBlur = 30;
                ctx.shadowColor = "rgba(0,0,0,0.7)";
                ctx.strokeStyle = "rgba(0,0,0,0.5)";
                ctx.lineWidth = 4;
                ctx.stroke();
                ctx.restore();
            });

            // SÉPARATEURS PHYSIQUES (RAINURES)
            const drawGroove = (tx, bx) => {
                ctx.beginPath();
                ctx.moveTo(tx, 0); ctx.lineTo(bx, h);
                ctx.strokeStyle = "rgba(0,0,0,0.8)";
                ctx.lineWidth = 8;
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(tx + 2, 0); ctx.lineTo(bx + 2, h);
                ctx.strokeStyle = "rgba(255,255,255,0.1)";
                ctx.lineWidth = 2;
                ctx.stroke();
            };

            drawGroove(p1 + skew, p1 - skew);
            drawGroove(p2 + skew, p2 - skew);

            // REFLET VITRÉ GLOBAL
            const grad = ctx.createLinearGradient(0, 0, w, h);
            grad.addColorStop(0, "rgba(255,255,255,0.1)");
            grad.addColorStop(0.5, "rgba(255,255,255,0)");
            grad.addColorStop(1, "rgba(255,255,255,0.05)");
            ctx.fillStyle = grad;
            ctx.fillRect(0,0,w,h);
        }

        function drawCover(ctx, img, x, y, w, h) {
            const imgRatio = img.width / img.height;
            const areaRatio = w / h;
            let sW, sH, sx, sy;

            if (imgRatio > areaRatio) {
                sW = img.height * areaRatio; sH = img.height;
                sx = (img.width - sW) / 2; sy = 0;
            } else {
                sW = img.width; sH = img.width / areaRatio;
                sx = 0; sy = (img.height - sH) / 2;
            }
            ctx.drawImage(img, sx, sy, sW, sH, x, y, w, h);
        }

        function download() {
            const link = document.createElement('a');
            link.download = 'koul-prez-ultra.png';
            link.href = document.getElementById('resultCanvas').toDataURL('image/png', 1.0);
            link.click();
        }
    </script>

    <style>
        #pwaInstallBtn {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #000000; color: white; border: none; padding: 12px 24px;
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; z-index: 10000; font-weight: bold; cursor: pointer;
        }
    </style>
    <button id="pwaInstallBtn">Installer l'application</button>
    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaInstallBtn').style.display = 'block';
        });
        document.getElementById('pwaInstallBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('pwaInstallBtn').style.display = 'none';
            }
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
