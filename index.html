<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Koul - Ultra Presentation Editor</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #121212;
            --card: #1e1e1e;
            --accent: #ffcc00;
            --shadow: 8px 8px 16px #0a0a0a, -4px -4px 12px #2a2a2a;
            --inner-shadow: inset 3px 3px 6px #0a0a0a, inset -2px -2px 5px #2a2a2a;
        }

        body { 
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            overflow-x: hidden;
        }

        .app-container {
            width: 90%;
            max-width: 420px;
            background: var(--card);
            padding: 25px;
            border-radius: 30px;
            box-shadow: var(--shadow);
            border: 1px solid #252525;
            text-align: center;
        }

        h1 { 
            font-family: 'Montserrat', sans-serif;
            font-size: 1.5rem;
            color: var(--accent);
            margin-bottom: 25px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .custom-file-input {
            background: var(--bg);
            padding: 12px;
            border-radius: 15px;
            box-shadow: var(--inner-shadow);
            font-size: 0.8rem;
            border: none;
            color: #888;
            cursor: pointer;
        }

        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        button {
            padding: 16px;
            border-radius: 18px;
            border: none;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn-compile {
            background: var(--accent);
            color: #000;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.4);
        }

        .btn-compile:active {
            transform: scale(0.95);
            box-shadow: none;
        }

        .btn-download {
            background: #ffffff;
            color: #000;
            box-shadow: 4px 4px 10px rgba(0,0,0,0.4);
        }

        canvas {
            width: 100%;
            margin-top: 25px;
            border-radius: 20px;
            border: 4px solid #252525;
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
        }

        .hidden { display: none; }
    </style>

    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4a90e2">
    <link rel="apple-touch-icon" href="icon.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
</head>
<body>

    <div class="app-container">
        <h1>Koul Design</h1>
        
        <div class="upload-section">
            <input type="file" id="img1" class="custom-file-input" accept="image/*">
            <input type="file" id="img2" class="custom-file-input" accept="image/*">
            <input type="file" id="img3" class="custom-file-input" accept="image/*">
        </div>

        <div class="btn-group">
            <button class="btn-compile" onclick="generateUltraBanner()">🚀 Générer le Montage</button>
            <button id="downloadBtn" class="btn-download hidden" onclick="downloadBanner()">⬇️ Télécharger PNG</button>
        </div>

        <canvas id="resultCanvas" width="1200" height="400" class="hidden"></canvas>
    </div>

    <script>
        async function generateUltraBanner() {
            const canvas = document.getElementById('resultCanvas');
            const ctx = canvas.getContext('2d');
            const ids = ['img1', 'img2', 'img3'];
            const images = [];

            for (let id of ids) {
                const file = document.getElementById(id).files[0];
                if (!file) return alert("Sélectionnez les 3 photos !");
                images.push(await loadImage(URL.createObjectURL(file)));
            }

            draw(ctx, canvas, images);
            canvas.classList.remove('hidden');
            document.getElementById('downloadBtn').classList.remove('hidden');
        }

        function loadImage(url) {
            return new Promise(resolve => {
                const img = new Image();
                img.onload = () => resolve(img);
                img.src = url;
            });
        }

        function draw(ctx, canvas, images) {
            const w = canvas.width;
            const h = canvas.height;
            const skew = 100; // Inclinaison
            const gapWidth = 10; // Largeur de la séparation physique

            ctx.clearRect(0, 0, w, h);

            // Points pivots
            const p1 = w / 3;
            const p2 = (w * 2) / 3;

            // Fonction pour tracer une zone oblique
            const drawZone = (points) => {
                ctx.beginPath();
                ctx.moveTo(points[0].x, points[0].y);
                points.forEach(p => ctx.lineTo(p.x, p.y));
                ctx.closePath();
            };

            // Zones
            const zones = [
                [{x:0, y:0}, {x:p1 + skew, y:0}, {x:p1 - skew, y:h}, {x:0, y:h}],
                [{x:p1 + skew, y:0}, {x:p2 + skew, y:0}, {x:p2 - skew, y:h}, {x:p1 - skew, y:h}],
                [{x:p2 + skew, y:0}, {x:w, y:0}, {x:w, y:h}, {x:p2 - skew, y:h}]
            ];

            zones.forEach((zone, i) => {
                ctx.save();
                drawZone(zone);
                ctx.clip();
                
                // Calcul du centre de la zone pour drawImage
                const minX = Math.min(...zone.map(p => p.x));
                const maxX = Math.max(...zone.map(p => p.x));
                drawImageCover(images[i], ctx, minX, 0, maxX - minX, h);
                
                // Ombre interne sur les bords pour l'effet de profondeur
                ctx.shadowBlur = 40;
                ctx.shadowColor = 'black';
                ctx.strokeStyle = 'rgba(0,0,0,0.8)';
                ctx.lineWidth = 10;
                ctx.stroke();
                ctx.restore();
            });

            // --- TRACAGE DES SÉPARATEURS (STYLE RAINURE 3D) ---
            const drawSeparator = (topX, bottomX) => {
                // Ligne sombre (profondeur)
                ctx.beginPath();
                ctx.moveTo(topX, 0); ctx.lineTo(bottomX, h);
                ctx.strokeStyle = "rgba(0,0,0,0.6)";
                ctx.lineWidth = gapWidth;
                ctx.stroke();

                // Ligne claire (reflet/lumière)
                ctx.beginPath();
                ctx.moveTo(topX + 2, 0); ctx.lineTo(bottomX + 2, h);
                ctx.strokeStyle = "rgba(255,255,255,0.15)";
                ctx.lineWidth = 2;
                ctx.stroke();
            };

            drawSeparator(p1 + skew, p1 - skew);
            drawSeparator(p2 + skew, p2 - skew);
        }

        function drawImageCover(img, ctx, x, y, w, h) {
            const imgAspect = img.width / img.height;
            const areaAspect = w / h;
            let sW, sH, sx, sy;

            if (imgAspect > areaAspect) {
                sW = img.height * areaAspect; sH = img.height;
                sx = (img.width - sW) / 2; sy = 0;
            } else {
                sW = img.width; sH = img.width / areaAspect;
                sx = 0; sy = (img.height - sH) / 2;
            }
            ctx.drawImage(img, sx, sy, sW, sH, x, y, w, h);
        }

        function downloadBanner() {
            const canvas = document.getElementById('resultCanvas');
            const link = document.createElement('a');
            link.download = 'koul-premium-banner.png';
            link.href = canvas.toDataURL('image/png', 1.0);
            link.click();
        }
    </script>

    <style>
        #pwaInstallBtn {
            position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
            background: #4a90e2; color: white; border: none; padding: 12px 24px;
            border-radius: 50px; box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            display: none; z-index: 10000; font-weight: bold; cursor: pointer;
        }
    </style>
    <button id="pwaInstallBtn">Installer l'application</button>
    <script>
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('pwaInstallBtn').style.display = 'block';
        });
        document.getElementById('pwaInstallBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                deferredPrompt = null;
                document.getElementById('pwaInstallBtn').style.display = 'none';
            }
        });
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW error:', err));
            });
        }
    </script>
</body>
</html>
